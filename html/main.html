<!DOCTYPE html>
<html>
    <head>
        <title>OrchestraLLM</title>
    </head>
    <body>
        <h4 id="welcome">Welcome, {{.}}</h4>
        <select id="model">
            <option value="openrouter/free">Auto (free models)</option>
        </select>
        <textarea id="prompt" placeholder="Write your request here."></textarea>
        <button id="submit">Submit</button>
        <pre id="response" style="white-space: pre-wrap;"></pre>
        <script>
        const submitBtn = document.getElementById("submit");
        const promptArea = document.getElementById("prompt");
        const modelSelect = document.getElementById("model");
        const responseArea = document.getElementById("response");
        const testJson = `{"ID": example, "Model": "example/example", "Role": "Example", "Prompt": "Example"}`;

        async function loadModels() {
            try {
                const response = await fetch('https://openrouter.ai/api/v1/models');
                if (!response.ok) throw new Error('Cannot load models');
                const data = await response.json();
                for (const model of data.data) {
                    if (model.id.endsWith(':free') &&
                        Number(model.pricing.prompt) === 0 && Number(model.pricing.completion) === 0 &&
                        model.architecture.output_modalities.includes('text')) {
                        modelSelect.add(new Option(model.name, model.id));
                    }
                }
            } catch (error) {
                responseArea.textContent = 'Could not load model list. Auto is still available.';
            }
        }
        loadModels();

        submitBtn.addEventListener('click', async () => {
            const userPrompt = promptArea.value.trim();
            if (!userPrompt) return;
            const models = Array.from(modelSelect.options, option => option.value);
            const prompt = "First of all: DON'T WRITE ANY TEXT OUT FROM THE JSON REQUEST YOU'LL WRITE (DO NOT. WRITE THE ONLY JSON REQUEST.). Answer like a professional Team Lead.' You have a list of the models and you should: A) Pick a codder-model B) Pick a code-review model. And also your answer should be based on JSON value signal and contain: ID (ID IS A FIELD. 1, 2, 3 etc.), Model (indicated in an array, also choose the name of the model from OpenRouter), Role (If the model is a programmer write 'Programmer'; 'Code-review' etc.), Propmt (your direct actions and what should a model do). User prompt: " + userPrompt + " The array of the available models (The field in JSON shouldn't be an array. Just an ordinary string-field): " + JSON.stringify(models) + " Write the JSON Request in this style: " + testJson;
            submitBtn.disabled = true;
            responseArea.textContent = 'Waiting for response…';
            try {
                const response = await fetch('/api/v1/orchestra/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model: modelSelect.value, prompt })
                });
                async function sendSignalJSON() {
                  const signal_req = await fetch('/api/v1/orchestra/signal', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json;charset=utf-8' },
                    body: response
                  });

                  if (!signal_req) {
                    throw new Error(`Err:  ${signal_req.status}`)
                  }

                  const res = await signal_req.json();
                  console.log('Succes! ', res);
                }
                
                const text = await response.text();
                if (!response.ok) throw new Error(text || `HTTP ${response.status}`);
                const data = JSON.parse(text);
                if (data.error) throw new Error(data.error.message);
                responseArea.textContent = data.choices?.[0]?.message?.content || 'Model returned no text.';
            } catch (error) {
                responseArea.textContent = error.message;
            } finally {
                submitBtn.disabled = false;
            }
        });
        </script>
    </body>
</html>
